[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysrfit"
version = "0.2.0"
description = "GUI-first, extensible muon spin spectroscopy fitting workbench"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "PySRFit contributors"}]
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
    "PyQt5>=5.15",
    "iminuit>=2.20",
    "h5py>=3.8",
    "uproot>=5",
    "mud-py>=1.3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.gui-scripts]
pysrfit = "pysrfit.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pysrfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
